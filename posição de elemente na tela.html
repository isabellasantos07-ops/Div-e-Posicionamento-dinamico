<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Listas</title>
    <style type="text/css">
        body {
            background-color: beige;
            font-family: verdana;
            color: black;
            font-size: 80%;
        }
        .logo {
            position: absolute;
            top: 10px;
            left: 50px;
        }
        .tabela {
            position: absolute;
            top: 40px;
            left: 190px;
        }
                table {
            border-collapse: separate;
            border-spacing: 12px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        td {
            padding: 5px 5px;
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
            background: linear-gradient(145deg, #2a2a40, #222235);
            border-radius: 10px;
            color: #e0e0fc;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        td:hover {
            background: linear-gradient(145deg, #00ffcc, #00b3ff);
            color: #111119;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 255, 204, 0.3);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="logo">
        <img src="https://i.pinimg.com/474x/32/55/7f/32557fce6966a32c43b2d0405b80d8d6.jpg" alt="Sun Logo" width="100">
    </div>

    <div class="tabela">
        <table border="1" cellpadding="4" cellspacing="0" bordercolor="blue">
            <tr>
                <td>Janeiro</td>
                <td>Fevereiro</td>
                <td>Março</td>
            </tr>
            <tr>
                <td>Abril</td>
                <td>Maio</td>
                <td>Junho</td>
            </tr>
            <tr>
                <td>Julho</td>
                <td>Agosto</td>
                <td>Setembro</td>
            </tr>
        </table>
    </div>

</body>
</html>
