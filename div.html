<html>
<head>
    <title>Listas</title>
    <style type="text/css">
        body {
            background-color: #f4f4f9; /* Fundo cinza claro moderno */
            font-family: Arial, verdana, sans-serif; /* Fontes mais limpas */
            color: #333333; /* Texto cinza escuro para melhor leitura */
            font-size: 90%; /* Texto levemente maior */
        }
        h1, h3 {
            color: #2c3e50; /* Títulos em um tom elegante de azul escuro */
        }
        img {
            margin-top: 20px; /* Afasta o botão do texto */
            border-radius: 8px; /* Arredonda os cantos do botão */
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1); /* Cria uma sombra suave */
            cursor: pointer; /* Faz o mouse virar a "mãozinha" de clique */
        }
    </style>
</head>
<body>
    <div align="center" style="margin-top: 50px;"> <!-- Desce o conteúdo para não ficar colado no topo -->
        <h1>Bem-vindo ao site</h1>
        <h3>Clique no botão abaixo para entrar</h3>
        <img src="imagens/botao.gif" alt="Botão Entrar" />
    </div>
</body>
</html>
